spring.application.name=khronos-demo

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5

# Flyway owns the schema (src/main/resources/db/migration); Hibernate only checks that the entities match it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# A database that already has tables but no migration history is marked as being at V1 (the baseline),
# so only V2 and later run there
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Only /actuator/health is exposed, without details, for load balancers and container checks
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

resend.api-key=${RESEND_API_KEY}
resend.from=${RESEND_FROM:Khronos <onboarding@resend.dev>}
resend.connect-timeout=${RESEND_CONNECT_TIMEOUT:PT5S}
resend.read-timeout=${RESEND_READ_TIMEOUT:PT10S}

# In-app notifications (see README, In-app notifications): notices older than this are deleted every night
app.notifications.retention=${NOTIFICATIONS_RETENTION:P90D}

# Web Push (see README, Push notifications). Without both keys push is off and only emails go out
app.push.vapid-public-key=${PUSH_VAPID_PUBLIC_KEY:}
app.push.vapid-private-key=${PUSH_VAPID_PRIVATE_KEY:}
app.push.subject=${PUSH_VAPID_SUBJECT:}
app.push.ttl=${PUSH_TTL:P1D}
app.push.connect-timeout=${PUSH_CONNECT_TIMEOUT:PT5S}
app.push.read-timeout=${PUSH_READ_TIMEOUT:PT10S}
# Push services a device's endpoint may point at: Chrome and Edge on Android (FCM), Firefox, Safari, Windows
app.push.allowed-hosts=${PUSH_ALLOWED_HOSTS:fcm.googleapis.com,updates.push.services.mozilla.com,*.push.apple.com,*.notify.windows.com}

app.jwt.secret=${JWT_SECRET:}
app.jwt.ttl=${JWT_TTL:PT1H}

# Sessions behind the refresh token (see README, Authentication). A device not used for idle-ttl is signed out;
# each use starts the count again. Signing in on more than max-per-user devices ends the least used one
app.session.idle-ttl=${SESSION_IDLE_TTL:P90D}
app.session.max-per-user=${SESSION_MAX_PER_USER:20}
app.session.reuse-grace=${SESSION_REUSE_GRACE:PT1M}

# Comma-separated browser origins allowed to call the API (for example https://app.example.com).
# Empty means no cross-origin access.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Most items accepted in one POST of shifts, events or assignments; larger lists answer 400
app.batch.max-size=${BATCH_MAX_SIZE:200}

# Failed sign-ins allowed per username and client IP within the window; after that login answers 429
app.login.max-attempts=${LOGIN_MAX_ATTEMPTS:5}
app.login.window=${LOGIN_WINDOW:PT15M}
# Failed sign-ins allowed per client IP within the same window, whatever the usernames; after that
# every login from that IP answers 429
app.login.max-attempts-per-ip=${LOGIN_MAX_ATTEMPTS_PER_IP:50}
# Failed sign-ins allowed per username within user-window, whatever the IPs; after that login answers 429
# for that username, except from an IP it signed in from successfully in the last 30 days
app.login.max-attempts-per-user=${LOGIN_MAX_ATTEMPTS_PER_USER:10}
app.login.user-window=${LOGIN_USER_WINDOW:PT1H}

# The client IP behind a reverse proxy (Fly.io, Render, Caddy...). Tomcat takes it from X-Forwarded-For only
# when the connection comes from a private address (the proxy), and then the last address the proxy added,
# so a client cannot choose its IP by sending the header itself. Directly exposed, the header is ignored.
# If the proxy connects from a public address, list it in SERVER_TOMCAT_REMOTEIP_INTERNAL_PROXIES (a regex).
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:native}

# Time tracking, as ISO-8601 durations. A shift whose first clock-in is later than late-threshold after it starts is late;
# a clock-in up to shift-match-window before a shift starts (or during it) counts for that shift;
# an entry still open after stale-after is flagged as a likely forgotten clock-out
app.time-tracking.late-threshold=${LATE_THRESHOLD:PT10M}
app.time-tracking.shift-match-window=${SHIFT_MATCH_WINDOW:PT3H}
app.time-tracking.stale-after=${STALE_ENTRY_AFTER:PT16H}

# Cash closings. A day whose counted cash differs from the expected cash by more than this many euros,
# either way, can only be closed with a reason for the difference
app.cash-closing.difference-threshold=${CASH_DIFFERENCE_THRESHOLD:5.00}

# First platform admin, created at startup only if no user has this username yet (see AdminBootstrap)
app.admin.username=${APP_ADMIN_USERNAME:}
app.admin.password=${APP_ADMIN_PASSWORD:}
app.admin.email=${APP_ADMIN_EMAIL:}
