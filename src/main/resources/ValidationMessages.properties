# Field messages of a failed validation (fieldErrors), in the language of the request (see WebConfig).
# The app's own constraints; the standard ones come from Hibernate Validator, in English and Spanish.
khronos.validation.MaxBytes.message=must be at most {value} bytes long
khronos.validation.TimeZoneId.message=must be an IANA time zone such as Europe/Madrid
khronos.validation.MaxBatchSize.message=must not contain more than {max} items
khronos.validation.phone=must be a valid phone number
