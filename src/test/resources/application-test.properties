# Profile used by the integration tests (support/IntegrationTest). The database still comes from
# DB_URL, DB_USERNAME and DB_PASSWORD, and must be an empty PostgreSQL database that Flyway can migrate.
spring.main.banner-mode=off
# Lets tests count SQL statements, to catch listings that run one query per row
spring.jpa.properties.hibernate.generate_statistics=true
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.org.flywaydb=WARN
logging.level.com.zaxxer.hikari=WARN
