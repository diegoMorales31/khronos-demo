name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: khronos_test
          POSTGRES_USER: khronos
          POSTGRES_PASSWORD: khronos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U khronos -d khronos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_URL: jdbc:postgresql://localhost:5432/khronos_test
      DB_USERNAME: khronos
      DB_PASSWORD: khronos
      # Throwaway values for the test run only; real deployments set their own
      JWT_SECRET: ci-only-signing-secret-0123456789-abcdefghij
      RESEND_API_KEY: ci-dummy-key
      RESEND_BASE_URL: http://127.0.0.1:9
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run the tests
        run: ./mvnw -B test
